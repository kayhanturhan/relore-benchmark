final_agent_response: >-
  ## Bug


  `apply_discount` in `pricing_service.py` computed the **discount amount**
  (`price * percentage / 100`), not the **price after the discount**.


  For `apply_discount(200.0, 10.0)` that yielded **20.0** (10% of 200) while the
  test expects **180.0** (200 minus 10%).


  ## Fix


  Return the discounted price by subtracting the percentage from the full price:


  ```python

  return price * (1 - percentage / 100)

  ```


  All **13** tests pass, including `test_apply_discount`.
