final_agent_response: >-
  ## Bug


  `apply_discount` in `pricing_service.py` computed the **discount amount**
  (`price * percentage / 100`), so `apply_discount(200.0, 10.0)` returned
  **20.0** instead of the **price after discount**.


  ## Fix


  Return the discounted price by subtracting the percentage from 100%:


  ```python

  return price * (1 - percentage / 100)

  ```


  For 200 at 10% off, that yields **180.0**, which matches
  `test_apply_discount`.


  All **13** tests pass.
